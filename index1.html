
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#176b36">
<title>Mahilang Krishi Farm</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f7f1;
 color:#183522;
}
header{
 background:#176b36;
 color:white;
 padding:22px 16px;
 border-radius:0 0 22px 22px;
}
header h2{margin:0 0 7px}
header p{margin:0;font-size:13px;color:#d8f1dd}
.container{padding:15px;max-width:650px;margin:auto}
.balance{
 background:white;
 border-radius:16px;
 padding:18px;
 margin-top:15px;
 box-shadow:0 2px 10px #00000010;
}
.balance small{color:#657b69}
.balance h1{color:#176b36;margin:8px 0}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:11px;
 margin:16px 0;
}
.machine{
 background:white;
 border-radius:14px;
 padding:15px 10px;
 text-align:center;
 border:1px solid #e1eee3;
 cursor:pointer;
}
.machine:active{background:#e1f4e5}
.machine .emoji{font-size:30px}
.machine b{display:block;margin-top:8px}
.card{
 background:white;
 padding:17px;
 border-radius:16px;
 margin:14px 0;
 box-shadow:0 2px 9px #0000000a;
}
h3{margin:0 0 15px;color:#176b36}
label{
 display:block;
 margin:12px 0 6px;
 font-size:14px;
 font-weight:bold;
}
input,select{
 width:100%;
 padding:12px;
 border:1px solid #cbdccb;
 border-radius:9px;
 font-size:15px;
 background:white;
}
button{
 border:0;
 padding:13px;
 border-radius:10px;
 background:#176b36;
 color:white;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}
button:active{opacity:.8}
.full{width:100%;margin-top:15px}
.secondary{background:#e5f3e8;color:#176b36}
.delete{background:#ffe9e9;color:#b32626;padding:8px}
.item{
 border-bottom:1px solid #e7eee7;
 padding:12px 0;
}
.item:last-child{border:0}
.item strong{color:#176b36}
footer{
 text-align:center;
 padding:20px;
 color:#718273;
 font-size:12px;
}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}
.hidden{display:none}
</style>
</head>

<body>

<header>
 <h2>🌾 Mahilang Krishi Farm</h2>
 <p>खेती की मशीनों का पूरा हिसाब-किताब</p>
</header>

<div class="container">

 <div class="balance">
  <small>कुल मशीन कार्य की कमाई</small>
  <h1 id="total">₹0.00</h1>
  <small>कुल रिकॉर्ड: <b id="count">0</b></small>
 </div>

 <h3 style="margin-top:22px">🚜 कृषि मशीनें चुनें</h3>

 <div class="grid" id="machineGrid"></div>

 <div class="card">
  <h3>➕ नया मशीन कार्य जोड़ें</h3>

  <label>मशीन का नाम</label>
  <select id="machine">
   <option>ट्रैक्टर</option>
   <option>हार्वेस्टर</option>
   <option>थ्रेशर</option>
   <option>ट्रॉली</option>
   <option>रोटावेटर</option>
   <option>लेवलर</option>
   <option>कल्टीवेटर</option>
   <option>हल / प्लाऊ</option>
  </select>

  <label>मशीन का प्रकार</label>
  <select id="ownership">
   <option>अपनी मशीन</option>
   <option>किराये की मशीन</option>
  </select>

  <label>काम का हिसाब</label>
  <select id="unit">
   <option value="hour">घंटे के हिसाब से</option>
   <option value="acre">एकड़ के हिसाब से</option>
  </select>

  <label>काम की मात्रा (घंटे या एकड़)</label>
  <input type="number" id="quantity" min="0.01" step="0.01"
   placeholder="जैसे 5">

  <label>प्रति घंटा / प्रति एकड़ रेट (₹)</label>
  <input type="number" id="rate" min="0" step="0.01"
   placeholder="जैसे 800">

  <label>डीजल खर्च (₹)</label>
  <input type="number" id="diesel" min="0" step="0.01"
   placeholder="डीजल खर्च">

  <label>अन्य मशीन खर्च (₹)</label>
  <input type="number" id="other" min="0" step="0.01"
   placeholder="मरम्मत आदि">

  <label>काम की तारीख</label>
  <input type="date" id="date">

  <label>ग्राहक / काम का विवरण (वैकल्पिक)</label>
  <input type="text" id="customer"
   placeholder="नाम या खेत का विवरण">

  <button class="full" onclick="saveRecord()">
   रिकॉर्ड सेव करें
  </button>
 </div>

 <div class="card">
  <h3>📋 मशीन कार्य का इतिहास</h3>
  <div id="history">
   अभी कोई रिकॉर्ड नहीं है।
  </div>
 </div>

 <button class="full secondary" onclick="clearForm()">
  फॉर्म खाली करें
 </button>

</div>

<footer>
 Mahilang Krishi Farm • Version 1.0
</footer>

<script>
const machines = [
 ["🚜","ट्रैक्टर"],
 ["🌾","हार्वेस्टर"],
 ["⚙️","थ्रेशर"],
 ["🛞","ट्रॉली"],
 ["🔧","रोटावेटर"],
 ["📏","लेवलर"],
 ["🌱","कल्टीवेटर"],
 ["🚜","हल / प्लाऊ"]
];

let records = [];

try {
 records = JSON.parse(
  localStorage.getItem("mah il_records".replace(" ","")) || "[]"
 );
 if(!Array.isArray(records)) records=[];
} catch(e) {
 records=[];
}

function money(n){
 return "₹"+Number(n).toLocaleString("en-IN",{
  minimumFractionDigits:2,
  maximumFractionDigits:2
 });
}

function drawMachines(){
 document.getElementById("machineGrid").innerHTML =
 machines.map(m=>`
  <div class="machine" onclick="chooseMachine('${m[1]}')">
   <div class="emoji">${m[0]}</div>
   <b>${m[1]}</b>
  </div>
 `).join("");
}

function chooseMachine(name){
 document.getElementById("machine").value=name;
 document.getElementById("machine").scrollIntoView({
  behavior:"smooth",block:"center"
 });
}

function saveRecord(){
 const machine=document.getElementById("machine").value;
 const ownership=document.getElementById("ownership").value;
 const unit=document.getElementById("unit").value;
 const quantity=Number(document.getElementById("quantity").value);
 const rate=Number(document.getElementById("rate").value);
 const diesel=Number(document.getElementById("diesel").value||0);
 const other=Number(document.getElementById("other").value||0);
 const date=document.getElementById("date").value;
 const customer=document.getElementById("customer").value.trim();

 if(!quantity || quantity<=0){
  alert("काम की सही मात्रा भरें।");
  return;
 }
 if(document.getElementById("rate").value==="" || rate<0){
  alert("सही रेट भरें।");
  return;
 }
 if(diesel<0 || other<0){
  alert("खर्च शून्य से कम नहीं हो सकता।");
  return;
 }
 if(!date){
  alert("काम की तारीख चुनें।");
  return;
 }

 const income=quantity*rate;
 const expenses=diesel+other;

 const record={
  id:Date.now(),
  machine,
  ownership,
  unit,
  quantity,
  rate,
  income,
  diesel,
  other,
  expenses,
  profit:income-expenses,
  date,
  customer
 };

 records.unshift(record);
 localStorage.setItem("mah il_records".replace(" ",""),
  JSON.stringify(records));

 render();
 clearForm();
 alert("आपका मशीन कार्य रिकॉर्ड सेव हो गया!");
}

function render(){
 const total=records.reduce((s,r)=>s+r.income,0);
 document.getElementById("total").textContent=money(total);
 document.getElementById("count").textContent=records.length;

 const history=document.getElementById("history");

 if(!records.length){
  history.innerHTML="अभी कोई रिकॉर्ड नहीं है।";
  return;
 }

 history.innerHTML=records.map(r=>`
  <div class="item">
   <div class="row">
    <strong>${r.machine}</strong>
    <button class="delete" onclick="removeRecord(${r.id})">
     हटाएँ
    </button>
   </div>
   <p style="font-size:13px;color:#64766a">
    ${r.ownership} • ${r.date}
   </p>
   <p>काम: ${r.quantity} ${r.unit==="hour"?"घंटे":"एकड़"}</p>
   <p>रेट: ${money(r.rate)}</p>
   <p>कुल कमाई: <b>${money(r.income)}</b></p>
   <p>डीजल: ${money(r.diesel)} | अन्य खर्च: ${money(r.other)}</p>
   <p>कुल खर्च: ${money(r.expenses)}</p>
   <p>शुद्ध बचत / घाटा:
    <strong style="color:${r.profit>=0?"#176b36":"#c62828"}">
     ${money(r.profit)}
    </strong>
   </p>
   ${r.customer?`<p>विवरण: ${escapeHTML(r.customer)}</p>`:""}
  </div>
 `).join("");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function removeRecord(id){
 if(!confirm("क्या यह रिकॉर्ड हटाना चाहते हैं?"))return;
 records=records.filter(r=>r.id!==id);
 localStorage.setItem("mah il_records".replace(" ",""),
  JSON.stringify(records));
 render();
}

function clearForm(){
 ["quantity","rate","diesel","other","customer"].forEach(id=>{
  document.getElementById(id).value="";
 });
 document.getElementById("date").value=
  new Date().toISOString().slice(0,10);
}

document.getElementById("date").value=
 new Date().toISOString().slice(0,10);

drawMachines();
render();
</script>

</body>
  </html>
