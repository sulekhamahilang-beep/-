
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>महिलांग कृषि फार्म</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5ef;font-family:Arial,sans-serif;color:#222}
header{background:#168b27;color:white;padding:19px 15px;text-align:center}
header h2{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:12px}
.container{padding:13px;max-width:650px;margin:auto}
.heading{font-size:17px;font-weight:bold;margin:15px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.machine{background:white;border-radius:10px;padding:15px 8px;
border:1px solid #ddd;text-align:center;cursor:pointer;
box-shadow:0 2px 5px #0001;font-weight:bold}
.machine:active{background:#e4f5e4}
.machine span{display:block;font-size:27px;margin-bottom:7px}
.panel{background:white;padding:15px;border-radius:12px;margin-top:15px;
box-shadow:0 2px 7px #0001}
input,select{width:100%;padding:12px;margin:6px 0 12px;
border:1px solid #ccc;border-radius:7px;font-size:15px;background:white}
label{font-size:13px;font-weight:bold}
button{border:0;border-radius:7px;padding:12px;background:#168b27;
color:white;font-size:15px;font-weight:bold;cursor:pointer}
.full{width:100%}
.result{background:#e6f5e7;padding:13px;border-radius:9px;
margin-top:12px;display:none}
.amount{font-size:25px;color:#168b27;font-weight:bold}
.record{background:#fff;border-radius:9px;padding:12px;
margin:9px 0;border-left:4px solid #168b27}
.record small{color:#666}
.record button{padding:7px 10px;font-size:12px;margin-top:8px}
.delete{background:#c62828}
.edit{background:#2874b9}
.total{background:#168b27;color:white;padding:15px;
border-radius:10px;margin-top:12px}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>🌾 महिलांग कृषि फार्म</h2>
<p>कृषि यंत्र हिसाब-किताब केंद्र</p>
</header>

<div class="container">

<div class="heading">🚜 कृषि यंत्र चुनें</div>
<div class="grid" id="machines"></div>

<div class="panel hidden" id="calculator">
<h3 id="machineTitle">कैलकुलेटर</h3>

<label>किसान / ग्राहक का नाम</label>
<input id="farmer" placeholder="किसान का नाम">

<label>खेत / गांव का नाम</label>
<input id="field" placeholder="खेत या गांव का नाम">

<label id="rateLabel">रेट (₹ प्रति घंटा)</label>
<input type="number" id="rate" placeholder="रेट डालें" min="0">

<div id="quantityFields"></div>

<label>काम की तारीख</label>
<input type="date" id="workDate">

<button class="full" onclick="calculate()">हिसाब करें</button>

<div class="result" id="result">
<div>कुल रकम</div>
<div class="amount" id="amount">₹0</div>
<div id="details"></div>
<button class="full" style="margin-top:12px" onclick="saveRecord()">
💾 हिसाब सेव करें
</button>
</div>
</div>

<!-- सेव बही हमेशा उपलब्ध -->
<div class="panel" id="myBook">
<div class="heading" style="margin-top:0">📒 मेरी सेव की हुई बही</div>
<div class="total">
<div>कुल सेव हिसाब</div>
<h2 id="totalRecords">0</h2>
<div>कुल दर्ज रकम</div>
<h2 id="totalMoney">₹0</h2>
</div>
<div id="history"></div>
</div>

<footer>© महिलांग कृषि फार्म | Version 1.0</footer>
</div>

<script>
const tools = [
{name:"ट्रैक्टर (घंटा)",icon:"🚜",unit:"घंटा",fields:["घंटे","मिनट"],mode:"time"},
{name:"ट्रैक्टर (एकड़)",icon:"🚜",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"ट्रॉली",icon:"🛻",unit:"चक्कर",fields:["कुल चक्कर"],mode:"trip"},
{name:"थ्रेशर",icon:"🌾",unit:"घंटा",fields:["घंटे","मिनट"],mode:"time"},
{name:"हार्वेस्टर",icon:"🚜",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"रोटावेटर",icon:"⚙️",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"कल्टीवेटर",icon:"⚙️",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"सीड ड्रिल",icon:"🌱",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"रीपर",icon:"🌾",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"धान रोपाई मशीन",icon:"🌱",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"स्प्रे मशीन",icon:"💧",unit:"एकड़",fields:["कुल एकड़"],mode:"area"},
{name:"JCB कृषि कार्य",icon:"🚜",unit:"घंटा",fields:["घंटे","मिनट"],mode:"time"}
];

let selected=null;
let lastCalculation=null;
let editId=null;
let records=JSON.parse(localStorage.getItem("mahilaKhetiBook")||"[]");

const machineBox=document.getElementById("machines");

tools.forEach((t,i)=>{
let d=document.createElement("div");
d.className="machine";
d.innerHTML=`<span>${t.icon}</span>${t.name}`;
d.onclick=()=>openCalculator(i);
machineBox.appendChild(d);
});

function openCalculator(i){
selected=tools[i];
editId=null;
document.getElementById("calculator").classList.remove("hidden");
document.getElementById("machineTitle").innerText=selected.icon+" "+selected.name;
document.getElementById("rateLabel").innerText="रेट (₹ प्रति "+selected.unit+")";

let html="";
selected.fields.forEach((f,index)=>{
html+=`<label>${f}</label>
<input type="number" min="0" step="any" id="qty${index}" placeholder="${f} डालें">`;
});
document.getElementById("quantityFields").innerHTML=html;
document.getElementById("farmer").value="";
document.getElementById("field").value="";
document.getElementById("rate").value="";
document.getElementById("workDate").value=new Date().toISOString().slice(0,10);
document.getElementById("result").style.display="none";
document.getElementById("calculator").scrollIntoView({behavior:"smooth"});
}

function calculate(){
let rate=Number(document.getElementById("rate").value);
let farmer=document.getElementById("farmer").value.trim();
let field=document.getElementById("field").value.trim();
let q0=Number(document.getElementById("qty0").value);
let q1=selected.fields.length>1?Number(document.getElementById("qty1").value):0;

if(!rate || rate<0 || !document.getElementById("qty0").value){
alert("कृपया रेट और काम की मात्रा भरें");
return;
}
if(selected.fields.length>1 && !document.getElementById("qty1").value){
alert("मिनट भी भरें");
return;
}

let quantity;
if(selected.mode==="time"){
if(q1>=60){alert("मिनट 0 से 59 के बीच रखें");return;}
quantity=q0+q1/60;
}else{
quantity=q0;
}
if(quantity<=0){alert("सही मात्रा डालें");return;}

let total=quantity*rate;
lastCalculation={
machine:selected.name,farmer,field,rate,
quantity,unit:selected.unit,total,
date:document.getElementById("workDate").value,
hours:q0,minutes:q1
};

document.getElementById("amount").innerText="₹"+total.toFixed(2);
document.getElementById("details").innerText=
"कुल काम: "+(selected.mode==="time"?q0+" घंटे "+q1+" मिनट":quantity+" "+selected.unit);
document.getElementById("result").style.display="block";
}

function saveRecord(){
if(!lastCalculation)return;
if(!lastCalculation.farmer){
alert("किसान का नाम भरें");
return;
}
if(editId!==null){
let index=records.findIndex(x=>x.id===editId);
if(index>=0)records[index]={...lastCalculation,id:editId};
editId=null;
}else{
records.unshift({...lastCalculation,id:Date.now()});
}
localStorage.setItem("mahilaKhetiBook",JSON.stringify(records));
document.getElementById("result").style.display="none";
showHistory();
alert("हिसाब सफलतापूर्वक सेव हो गया!");
}

function showHistory(){
let box=document.getElementById("history");
box.innerHTML="";
let total=records.reduce((s,r)=>s+r.total,0);
document.getElementById("totalRecords").innerText=records.length;
document.getElementById("totalMoney").innerText="₹"+total.toFixed(2);

if(records.length===0){
box.innerHTML="<p style='text-align:center;color:#777'>अभी कोई हिसाब सेव नहीं है।</p>";
return;
}

records.forEach(r=>{
let d=document.createElement("div");
d.className="record";
let title=document.createElement("b");
title.textContent=r.machine;
let info=document.createElement("div");
info.textContent="किसान: "+r.farmer+" | खेत: "+(r.field||"-");
let amount=document.createElement("b");
amount.textContent="कुल रकम: ₹"+r.total.toFixed(2);
let date=document.createElement("small");
date.textContent="तारीख: "+r.date;
let edit=document.createElement("button");
edit.className="edit";
edit.textContent="✏️ संपादित करें";
edit.onclick=()=>editRecord(r.id);
let del=document.createElement("button");
del.className="delete";
del.style.marginLeft="7px";
del.textContent="हटाएँ";
del.onclick=()=>deleteRecord(r.id);
d.append(title,info,amount,document.createElement("br"),date,
document.createElement("br"),edit,del);
box.appendChild(d);
});
}

function editRecord(id){
let r=records.find(x=>x.id===id);
if(!r)return;
let index=tools.findIndex(t=>t.name===r.machine);
openCalculator(index);
editId=id;
document.getElementById("farmer").value=r.farmer;
document.getElementById("field").value=r.field;
document.getElementById("rate").value=r.rate;
document.getElementById("workDate").value=r.date;
document.getElementById("qty0").value=r.hours??r.quantity;
if(selected.fields.length>1)
document.getElementById("qty1").value=r.minutes??0;
lastCalculation=r;
document.getElementById("calculator").scrollIntoView({behavior:"smooth"});
}

function deleteRecord(id){
if(!confirm("क्या आप यह हिसाब हटाना चाहते हैं?"))return;
records=records.filter(r=>r.id!==id);
localStorage.setItem("mahilaKhetiBook",JSON.stringify(records));
showHistory();
}

showHistory();
</script>
</body>
 </html>
